<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Snake Arena</title>
  <meta name="description" content="Eat, grow and trap rival snakes to become the biggest snake in the arena. Plays fully offline.">
  <meta name="theme-color" content="#17143a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" href="assets/ui/icon.png">
  <link rel="preload" href="fonts/lilitaone-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/fredoka-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-screen="loading">
  <canvas id="stage"></canvas>

  <main id="app">
    <!-- LOADING -->
    <section id="screen-loading" class="screen active">
      <div class="load-bar"><i id="load-fill"></i></div>
    </section>

    <!-- HOME (bots play live behind it) -->
    <section id="screen-home" class="screen">
      <div class="home-top">
        <div class="pill"><span data-art="coin"></span><b class="coin-count">0</b></div>
        <button class="icon-btn" id="btn-settings" aria-label="Settings"></button>
      </div>
      <div id="logo-wrap"></div>
      <div class="home-best"><span data-art="crown"></span><span>Best length</span><b id="home-best">0</b></div>
      <div class="home-actions">
        <button class="skin-card" id="home-skin" aria-label="Change skin"></button>
        <input id="nick" maxlength="12" placeholder="Your nickname" autocomplete="off" spellcheck="false">
        <button class="btn btn-green btn-play" id="btn-play"><span class="bi"></span><span>PLAY</span></button>
        <div class="home-row">
          <button class="btn btn-pink" id="btn-skins"><span data-art="skins"></span><span>Skins</span></button>
          <button class="btn btn-purple" id="btn-missions"><span data-art="missions"></span><span>Missions</span><i class="dot" id="missions-dot" hidden></i></button>
          <button class="btn btn-orange" id="btn-gift"><span data-art="gift"></span><span>Gift</span><i class="dot" id="gift-dot" hidden></i></button>
        </div>
      </div>
    </section>

    <!-- GAME -->
    <section id="screen-game" class="screen">
      <header class="topbar">
        <button class="icon-btn" id="btn-pause" aria-label="Pause"></button>
        <div class="len-wrap"><small>LENGTH</small><b id="len">0</b><span class="kills">💥 <b id="kills">0</b></span></div>
        <div class="rank-pill"><b id="rank">–</b><small id="rank-of"></small></div>
      </header>
      <ol id="board"></ol>
      <ul id="feed"></ul>
      <div id="active-pw"></div>
      <canvas id="minimap" width="110" height="110"></canvas>
      <button id="btn-boost" aria-label="Boost"></button>
      <div id="tap-hint" hidden>
        <div><span class="k">DRAG</span> to steer</div>
        <div><span class="k">HOLD ⚡</span> to boost</div>
        <div>Make others crash into <b>you</b>!</div>
      </div>
    </section>
  </main>

  <div id="modal-root"></div>
  <canvas id="fx"></canvas>
  <div id="floaters"></div>

  <script src="js/config.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/ads.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/skins.js"></script>
  <script src="js/arena.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
