<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Tile Trio</title>
  <meta name="description" content="Triple tile match puzzle: tap free tiles into the tray, match three of a kind and clear the pile. 120 levels, plays offline.">
  <meta name="theme-color" content="#ffd08a">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="icon" href="assets/icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-at="title">
  <canvas id="view"></canvas>

  <header class="hud">
    <button class="round" id="h-pause" aria-label="Pause"><i class="ic-pause"></i></button>
    <div class="lvl"><span id="h-lvl-n">Level 1</span><b class="hard" id="h-hard" hidden>HARD</b></div>
    <div class="coins"><i class="coin"></i><b id="h-coins">0</b></div>
  </header>
  <div class="goal" id="goal"><div class="goal-bar"><i id="g-fill"></i></div><span id="g-left">0 left</span><span class="clock" id="g-time">0:00</span></div>

  <nav class="tools" id="tools">
        <button class="tool" id="b-undo" aria-label="Undo"><span class="ti">↩️</span><small>Undo</small><em id="n-undo">3</em></button>
    <button class="tool" id="b-pop" aria-label="Pop out"><span class="ti">⏏️</span><small>Pop out</small><em id="n-pop">2</em></button>
    <button class="tool" id="b-shuffle" aria-label="Shuffle"><span class="ti">🔀</span><small>Shuffle</small><em id="n-shuffle">2</em></button>
  </nav>

  <section class="title" id="title">
    <div class="t-top">
      <div class="coins"><i class="coin"></i><b data-coins>0</b></div>
      <div class="t-right"><button class="round" id="t-gift" aria-label="Daily gift">🎁<em class="dot" id="b-gift" hidden></em></button><button class="round" id="t-sound" aria-label="Settings">⚙️</button></div>
    </div>
    <div class="logo-wrap">
      <div class="logo-tiles"><i>🍓</i><i>🍓</i><i>🍓</i></div>
      <h1 class="logo"><span>TILE</span><span>TRIO</span></h1>
      <p class="tag" id="tagline"></p>
    </div>
    <div class="t-bottom">
      <button class="btn big green" id="t-play"><span id="t-play-l">Level 1</span></button>
      <div class="row3"><button class="btn small" id="t-levels">Levels</button><button class="btn small" id="t-shop">Shop</button><button class="btn small" id="t-how">How to play</button></div>
    </div>
  </section>

  <div class="toast" id="toast" hidden></div>
  <div class="wrap" id="wrap" hidden><div class="sheet" id="sheet"></div></div>

  <script src="js/config.js"></script>
  <script src="js/skin.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/ads.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
