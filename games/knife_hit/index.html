<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Knife Hit</title>
  <meta name="description" content="Throw knives into spinning targets, slice apples and beat the bosses. Plays fully offline.">
  <meta name="theme-color" content="#1e1b38">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" href="assets/ui/icon.png">
  <link rel="preload" href="fonts/lilitaone-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/fredoka-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-screen="loading">
  <canvas id="stage"></canvas>

  <main id="app">
    <!-- LOADING -->
    <section id="screen-loading" class="screen active">
      <div class="load-knife">🔪</div>
      <div class="load-bar"><i id="load-fill"></i></div>
    </section>

    <!-- HOME (a target spins and gets hit behind the menu) -->
    <section id="screen-home" class="screen">
      <div class="home-top">
        <div class="pill apples-pill"><span data-art="apple"></span><b class="apple-count">0</b></div>
        <button class="icon-btn" id="btn-settings" aria-label="Settings"></button>
      </div>
      <div id="logo-wrap"></div>
      <div class="home-best">
        <span><small>BEST STAGE</small><b id="home-stage">0</b></span>
        <span><small>BEST SCORE</small><b id="home-score">0</b></span>
      </div>
      <div class="home-actions">
        <button class="btn btn-green btn-play" id="btn-play"><span class="bi"></span><span>PLAY</span></button>
        <div class="home-row">
          <button class="tile-btn" id="btn-knives"><span id="equip-prev"></span><b>Knives</b><i class="dot" id="knives-dot" hidden></i></button>
          <button class="tile-btn" id="btn-missions"><span data-art="missions"></span><b>Missions</b><i class="dot" id="missions-dot" hidden></i></button>
          <button class="tile-btn" id="btn-gift"><span data-art="gift"></span><b>Gift</b><i class="dot" id="gift-dot" hidden></i></button>
        </div>
      </div>
    </section>

    <!-- GAME -->
    <section id="screen-game" class="screen">
      <header class="topbar">
        <button class="icon-btn" id="btn-pause" aria-label="Pause"></button>
        <div class="score-wrap"><b id="score">0</b><div class="stage-row"><span id="stage-label">STAGE 1</span></div><div class="dots" id="dots"></div></div>
        <div class="pill apples-pill small"><span data-art="apple"></span><b class="apple-count">0</b></div>
      </header>
      <ul id="kleft"></ul>
      <div id="boss-banner" hidden></div>
      <div id="tap-hint" hidden><span>TAP</span> to throw!<small>Don't hit the other knives</small></div>
    </section>
  </main>

  <div id="modal-root"></div>
  <canvas id="fx"></canvas>
  <div id="floaters"></div>

  <script src="js/config.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/ads.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/skins.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
