<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Lot Escape</title>
  <meta name="description" content="Parking jam puzzle: tap a car to drive it out, swipe to reverse. Clear the packed parking lot without crashing. 120 levels, plays offline.">
  <meta name="theme-color" content="#8fdc6a">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="icon" href="assets/icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-at="title">
  <canvas id="view"></canvas>

  <header class="hud">
    <button class="round" id="h-pause" aria-label="Pause"><i class="ic-pause"></i></button>
    <div class="lvl"><span id="h-lvl-n">Level 1</span><b class="hard" id="h-hard" hidden>HARD</b><span class="hearts" id="h-hearts"></span></div>
    <div class="coins"><i class="coin"></i><b id="h-coins">0</b></div>
  </header>

  <nav class="tools" id="tools">
    <button class="tool" id="b-restart" aria-label="Restart"><span class="ti">↻</span><small>Restart</small></button>
    <button class="tool" id="b-hint" aria-label="Hint"><span class="ti">💡</span><small>Hint</small><em id="n-hint">3</em></button>
    <button class="tool" id="b-crane" aria-label="Crane"><span class="ti ti-crane"></span><small>Crane</small><em id="n-crane">2</em></button>
  </nav>
  <p class="drill-tip" id="crane-tip" hidden>Tap ANY car to lift it out</p>
  <p class="swipe-tip" id="swipe-tip" hidden>Swipe a car backwards to reverse it out!</p>

  <section class="title" id="title">
    <div class="t-top">
      <div class="coins"><i class="coin"></i><b data-coins>0</b></div>
      <div class="t-right"><button class="round" id="t-gift" aria-label="Daily gift">🎁<em class="dot" id="b-gift" hidden></em></button><button class="round" id="t-sound" aria-label="Settings">⚙️</button></div>
    </div>
    <div class="logo-wrap">
      <div class="logo-car"><i class="lc-roof"></i><i class="lc-glass"></i><i class="lc-w w1"></i><i class="lc-w w2"></i><i class="lc-l"></i></div>
      <h1 class="logo"><span>LOT</span><span>ESCAPE</span></h1>
      <p class="tag" id="tagline"></p>
    </div>
    <div class="t-bottom">
      <button class="btn big green" id="t-play"><span id="t-play-l">Level 1</span></button>
      <div class="row3"><button class="btn small" id="t-levels">Levels</button><button class="btn small" id="t-shop">Shop</button><button class="btn small" id="t-how">How to play</button></div>
    </div>
  </section>

  <div class="toast" id="toast" hidden></div>
  <div class="wrap" id="wrap" hidden><div class="sheet" id="sheet"></div></div>

  <script src="js/config.js"></script>
  <script src="js/skin.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/ads.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
