<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Hook &amp; Reel</title>
  <meta name="description" content="A woodblock-print fishing game: drop your hook deep, dodge the fish, then reel up and snag a big catch. Upgrades, rare fish and a fish log. Plays fully offline.">
  <meta name="theme-color" content="#1b2440">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="icon" href="assets/icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-at="dock">
  <canvas id="sea"></canvas>
  <header class="hud">
    <button class="stamp sq" id="h-pause" aria-label="Pause">II</button>
    <div class="seal"><small>DEPTH</small><b id="h-depth">0 m</b></div>
    <div class="seal"><small>CATCH</small><b id="h-catch">0/6</b></div>
    <span class="phase" id="h-phase">DOWN ↓</span>
  </header>

  <section class="dock" id="dock">
    <div class="top"><span class="coins">● <b data-coins>0</b></span><button class="stamp small" id="d-settings">SETTINGS</button></div>
    <div class="title"><h1>Hook<br><em>&amp;</em> Reel</h1><p id="tagline"></p></div>
    <button class="stamp big" id="d-cast">CAST THE LINE</button>
    <div class="ups" id="ups"></div>
    <div class="row"><button class="stamp" id="d-log">FISH LOG</button><button class="stamp" id="d-free">▶ FREE COINS</button></div>
  </section>

  <div class="modal" id="modal" hidden></div>
  <script src="js/config.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/ads.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
