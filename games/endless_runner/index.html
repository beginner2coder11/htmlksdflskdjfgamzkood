<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Dash Runner</title>
  <meta name="description" content="Jump, double jump, slide and stomp through five worlds. How far can you run?">
  <meta name="theme-color" content="#7fd3ff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" href="assets/ui/icon.png">
  <link rel="preload" href="fonts/lilitaone-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/fredoka-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-screen="loading">
  <canvas id="stage"></canvas>

  <main id="app">
    <!-- LOADING -->
    <section id="screen-loading" class="screen active">
      <div class="load-bar"><i id="load-fill"></i></div>
    </section>

    <!-- HOME (the demo runner plays behind it) -->
    <section id="screen-home" class="screen">
      <div class="home-top">
        <div class="pill"><span data-art="coin"></span><b class="coin-count">0</b></div>
        <button class="icon-btn" id="btn-settings" aria-label="Settings"></button>
      </div>
      <div id="logo-wrap"></div>
      <div class="home-best"><span data-art="crown"></span><span>Best</span><b id="home-best">0</b><span>m</span></div>
      <div class="home-actions">
        <button class="btn btn-green btn-play" id="btn-play"><span class="bi"></span><span>RUN!</span></button>
        <div class="home-row">
          <button class="btn btn-pink" id="btn-chars"><span data-art="shop"></span><span class="mb"><span>Heroes</span><small id="home-char">Blobby</small></span></button>
          <button class="btn btn-blue" id="btn-upgrades"><span data-art="upgrade"></span><span>Upgrades</span></button>
        </div>
        <div class="home-row">
          <button class="btn btn-purple" id="btn-missions"><span data-art="missions"></span><span>Missions</span><i class="dot" id="missions-dot" hidden></i></button>
          <button class="btn btn-orange" id="btn-gift"><span data-art="gift"></span><span>Gift</span><i class="dot" id="gift-dot" hidden></i></button>
        </div>
      </div>
    </section>

    <!-- GAME -->
    <section id="screen-game" class="screen">
      <header class="topbar">
        <button class="icon-btn" id="btn-pause" aria-label="Pause"></button>
        <div class="dist-wrap"><b id="dist">0</b><small>m</small></div>
        <div class="pill" id="coins"><span data-art="coin"></span><b id="run-coins">0</b></div>
      </header>
      <div id="active-pw"></div>
      <div id="tap-hint" hidden>
        <div><span class="k">TAP</span> jump</div>
        <div><span class="k">TAP ×2</span> double jump</div>
        <div><span class="k">SWIPE ↓</span> slide</div>
      </div>
    </section>
  </main>

  <div id="modal-root"></div>
  <canvas id="fx"></canvas>
  <div id="floaters"></div>

  <script src="js/config.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/ads.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/characters.js"></script>
  <script src="js/runner.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
