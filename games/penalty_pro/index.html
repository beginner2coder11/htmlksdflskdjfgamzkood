<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Penalty Pro</title>
  <meta name="description" content="Football penalty shootout game: swipe to shoot, curl it into the top corner, then tap to dive and save. Win 5 cups and 60 matches. Plays offline.">
  <meta name="theme-color" content="#13213a">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="icon" href="assets/icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-at="title">
  <canvas id="view"></canvas>

  <header class="hud">
    <button class="round" id="h-pause" aria-label="Pause"><i class="ic-pause"></i></button>
    <div class="lvl"><div><span id="h-round">Round of 16</span><small id="h-cup">Bronze Cup</small></div></div>
    <div class="coins"><i class="coin"></i><b id="h-coins">0</b></div>
  </header>
  <div class="score" id="score">
    <div class="sc-row me"><span class="tm"><i id="s-me-c"></i>YOU</span><span class="ks" id="s-me"></span><span class="n" id="s-me-n">0</span></div>
    <div class="sc-row"><span class="tm"><i id="s-op-c"></i><span id="s-op-name">RDL</span></span><span class="ks" id="s-op"></span><span class="n" id="s-op-n">0</span></div>
    <div class="sd" id="s-sd" hidden>SUDDEN DEATH</div>
  </div>

  <section class="title" id="title">
    <div class="t-top">
      <div class="coins"><i class="coin"></i><b data-coins>0</b></div>
      <div class="t-right"><button class="round" id="t-gift" aria-label="Daily gift">🎁<em class="dot" id="b-gift" hidden></em></button><button class="round" id="t-sound" aria-label="Settings">⚙️</button></div>
    </div>
    <div class="logo-wrap">
      <div class="logo-goal"><i class="lg-net"></i><i class="lg-ball"></i></div>
      <h1 class="logo"><span>PENALTY</span><span>PRO</span></h1>
      <p class="tag" id="tagline"></p>
    </div>
    <div class="t-bottom">
      <button class="btn big green" id="t-play"><span id="t-play-l">Play</span></button>
      <div class="row3"><button class="btn small" id="t-levels">Cups</button><button class="btn small" id="t-shop">Kits</button><button class="btn small" id="t-how">How to play</button></div>
    </div>
  </section>

  <div class="toast" id="toast" hidden></div>
  <div class="wrap" id="wrap" hidden><div class="sheet" id="sheet"></div></div>

  <script src="js/config.js"></script>
  <script src="js/skin.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/ads.js"></script>
  <script src="js/kick.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
